[project]
name = "footnoteone"
dynamic = ["version"]
description = "FootnoteOne: an honest instrument for creators to see which of their pages AI answer engines search, read and cite."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mohammad Ali Shehral" }]
requires-python = ">=3.12"
keywords = ["generative engine optimization", "citations", "answer engines", "measurement"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "pydantic>=2.10",
  "httpx>=0.27",
  "typer>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-httpx>=0.33",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
footnote = "footnoteone.cli:app"

[project.urls]
Homepage = "https://github.com/shehral/footnoteone"
Repository = "https://github.com/shehral/footnoteone"
Issues = "https://github.com/shehral/footnoteone/issues"
Changelog = "https://github.com/shehral/footnoteone/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/footnoteone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/footnoteone"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
